<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <article class="weather-widget">

    <!-- LEFT: current weather -->
    <section class="current-weather">
      <header>
        <h2>Monday</h2>
        <time datetime="2022-06-20">20 Jun 2022</time>
      </header>

      <div class="current-stats">
        <div class="weather-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="28" cy="28" r="10" fill="white" opacity="0.95"/>
            <g stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
              <line x1="28" y1="6"  x2="28" y2="12"/>
              <line x1="28" y1="44" x2="28" y2="50"/>
              <line x1="6"  y1="28" x2="12" y2="28"/>
              <line x1="44" y1="28" x2="50" y2="28"/>
              <line x1="12.69" y1="12.69" x2="16.97" y2="16.97"/>
              <line x1="39.03" y1="39.03" x2="43.31" y2="43.31"/>
              <line x1="43.31" y1="12.69" x2="39.03" y2="16.97"/>
              <line x1="16.97" y1="39.03" x2="12.69" y2="43.31"/>
            </g>
          </svg>
        </div>
        <p class="temperature">29 °C</p>
        <p class="range">H: 31° L: 24°</p>
        <p class="condition">Sunny</p>
      </div>
    </section>

    <!-- RIGHT: details -->
    <section class="weather-details">

      <dl class="metrics">
        <dt>Precipitation</dt>
        <dd>0%</dd>

        <dt>Humidity</dt>
        <dd>42%</dd>

        <dt>Wind</dt>
        <dd>3 km/h</dd>

        <dd class="unit-toggle">°C / °F</dd>
      </dl>

      <section class="forecast">
        <h3 class="visually-hidden">4-Day Forecast</h3>

        <ol class="forecast-list">

          <li class="forecast-day active">
            <abbr title="Tuesday">Tue</abbr>
            <span class="day-icon">
              <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Sunny">
                <circle cx="28" cy="28" r="10" fill="#222831"/>
                <g stroke="#222831" stroke-width="2.5" stroke-linecap="round">
                  <line x1="28" y1="6"  x2="28" y2="12"/>
                  <line x1="28" y1="44" x2="28" y2="50"/>
                  <line x1="6"  y1="28" x2="12" y2="28"/>
                  <line x1="44" y1="28" x2="50" y2="28"/>
                  <line x1="12.69" y1="12.69" x2="16.97" y2="16.97"/>
                  <line x1="39.03" y1="39.03" x2="43.31" y2="43.31"/>
                  <line x1="43.31" y1="12.69" x2="39.03" y2="16.97"/>
                  <line x1="16.97" y1="39.03" x2="12.69" y2="43.31"/>
                </g>
              </svg>
            </span>
            <span class="temp">30 °C</span>
          </li>

          <li class="forecast-day">
            <abbr title="Wednesday">Wed</abbr>
            <span class="day-icon">
              <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Partly Cloudy">
                <g stroke="white" stroke-width="2.2" stroke-linecap="round">
                  <line x1="22" y1="8"  x2="22" y2="13"/>
                  <line x1="10" y1="20" x2="14" y2="20"/>
                  <line x1="13.5" y1="11.5" x2="17" y2="15"/>
                </g>
                <circle cx="22" cy="20" r="7" fill="white" opacity="0.7"/>
                <rect x="10" y="27" width="30" height="10" rx="5" fill="white" opacity="0.9"/>
              </svg>
            </span>
            <span class="temp">22 °C</span>
          </li>

          <li class="forecast-day">
            <abbr title="Thursday">Thu</abbr>
            <span class="day-icon">
              <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Rainy">
                <rect x="8" y="16" width="34" height="12" rx="6" fill="white" opacity="0.85"/>
                <g stroke="white" stroke-width="2.2" stroke-linecap="round">
                  <line x1="16" y1="33" x2="14" y2="40"/>
                  <line x1="24" y1="33" x2="22" y2="40"/>
                  <line x1="32" y1="33" x2="30" y2="40"/>
                </g>
              </svg>
            </span>
            <span class="temp">06 °C</span>
          </li>

          <li class="forecast-day">
            <abbr title="Friday">Fri</abbr>
            <span class="day-icon">
              <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Sunny">
                <circle cx="28" cy="28" r="9" fill="white" opacity="0.9"/>
                <g stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
                  <line x1="28" y1="8"  x2="28" y2="13"/>
                  <line x1="28" y1="43" x2="28" y2="48"/>
                  <line x1="8"  y1="28" x2="13" y2="28"/>
                  <line x1="43" y1="28" x2="48" y2="28"/>
                  <line x1="13.5" y1="13.5" x2="17" y2="17"/>
                  <line x1="39"   y1="39"   x2="42.5" y2="42.5"/>
                  <line x1="42.5" y1="13.5" x2="39"   y2="17"/>
                  <line x1="17"   y1="39"   x2="13.5" y2="42.5"/>
                </g>
              </svg>
            </span>
            <span class="temp">26 °C</span>
          </li>

        </ol>

        <div class="pagination-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </section>

      <footer>
        <button type="button" class="location-btn" aria-label="Change location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <address>New York City</address>
        </button>
      </footer>

    </section>

  </article>

</body>
</html>
