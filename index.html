<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <article class="weather-widget">

    <!-- LEFT: current weather -->
    <section class="current-weather">
      <header>
        <h2>Monday</h2>
        <time datetime="2022-06-20">20 Jun 2022</time>
      </header>

      <div class="current-stats">
        <div class="weather-icon">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="28" cy="28" r="10" fill="white" opacity="0.95"/>
            <g stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
              <line x1="28" y1="6"  x2="28" y2="12"/>
              <line x1="28" y1="44" x2="28" y2="50"/>
              <line x1="6"  y1="28" x2="12" y2="28"/>
              <line x1="44" y1="28" x2="50" y2="28"/>
              <line x1="12.69" y1="12.69" x2="16.97" y2="16.97"/>
              <line x1="39.03" y1="39.03" x2="43.31" y2="43.31"/>
              <line x1="43.31" y1="12.69" x2="39.03" y2="16.97"/>
              <line x1="16.97" y1="39.03" x2="12.69" y2="43.31"/>
            </g>
          </svg>
        </div>
        <p class="temperature">29 °C</p>
        <p class="range">H: 31° L: 24°</p>
        <p class="condition">Sunny</p>
      </div>
    </section>

    <!-- RIGHT: details -->
    <section class="weather-details">

      <dl class="metrics">
        <dt>Precipitation</dt>
        <dd>0%</dd>

        <dt>Humidity</dt>
        <dd>42%</dd>

        <dt>Wind</dt>
        <dd>3 km/h</dd>

        <dd class="unit-toggle">
          <button class="unit-btn active" data-unit="c">°C</button>
          <span>/</span>
          <button class="unit-btn" data-unit="f">°F</button>
        </dd>
      </dl>

      <section class="forecast">
        <h3 class="visually-hidden">4-Day Forecast</h3>

        <div class="forecast-scroll-wrap">

          <!-- Left scrim + back arrow (hidden on page 0) -->
          <div class="forecast-scrim forecast-scrim--left"></div>
          <button class="forecast-arrow forecast-arrow--left" aria-label="Previous days">
            <svg width="12" height="20" viewBox="0 0 12 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <polyline points="11,1 1,10 11,19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ol class="forecast-list">
            <li class="forecast-day active">
              <abbr title="Tuesday">Tue</abbr>
              <span class="day-icon">
                <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Sunny">
                  <circle cx="28" cy="28" r="10" fill="#222831"/>
                  <g stroke="#222831" stroke-width="2.5" stroke-linecap="round">
                    <line x1="28" y1="6"  x2="28" y2="12"/>
                    <line x1="28" y1="44" x2="28" y2="50"/>
                    <line x1="6"  y1="28" x2="12" y2="28"/>
                    <line x1="44" y1="28" x2="50" y2="28"/>
                    <line x1="12.69" y1="12.69" x2="16.97" y2="16.97"/>
                    <line x1="39.03" y1="39.03" x2="43.31" y2="43.31"/>
                    <line x1="43.31" y1="12.69" x2="39.03" y2="16.97"/>
                    <line x1="16.97" y1="39.03" x2="12.69" y2="43.31"/>
                  </g>
                </svg>
              </span>
              <span class="temp">30 °C</span>
            </li>

            <li class="forecast-day">
              <abbr title="Wednesday">Wed</abbr>
              <span class="day-icon">
                <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Partly Cloudy">
                  <g stroke="white" stroke-width="2.2" stroke-linecap="round">
                    <line x1="22" y1="8"  x2="22" y2="13"/>
                    <line x1="10" y1="20" x2="14" y2="20"/>
                    <line x1="13.5" y1="11.5" x2="17" y2="15"/>
                  </g>
                  <circle cx="22" cy="20" r="7" fill="white" opacity="0.7"/>
                  <rect x="10" y="27" width="30" height="10" rx="5" fill="white" opacity="0.9"/>
                </svg>
              </span>
              <span class="temp">22 °C</span>
            </li>

            <li class="forecast-day">
              <abbr title="Thursday">Thu</abbr>
              <span class="day-icon">
                <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Rainy">
                  <rect x="8" y="16" width="34" height="12" rx="6" fill="white" opacity="0.85"/>
                  <g stroke="white" stroke-width="2.2" stroke-linecap="round">
                    <line x1="16" y1="33" x2="14" y2="40"/>
                    <line x1="24" y1="33" x2="22" y2="40"/>
                    <line x1="32" y1="33" x2="30" y2="40"/>
                  </g>
                </svg>
              </span>
              <span class="temp">06 °C</span>
            </li>

            <li class="forecast-day">
              <abbr title="Friday">Fri</abbr>
              <span class="day-icon">
                <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Sunny">
                  <circle cx="28" cy="28" r="9" fill="white" opacity="0.9"/>
                  <g stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.7">
                    <line x1="28" y1="8"  x2="28" y2="13"/>
                    <line x1="28" y1="43" x2="28" y2="48"/>
                    <line x1="8"  y1="28" x2="13" y2="28"/>
                    <line x1="43" y1="28" x2="48" y2="28"/>
                    <line x1="13.5" y1="13.5" x2="17" y2="17"/>
                    <line x1="39"   y1="39"   x2="42.5" y2="42.5"/>
                    <line x1="42.5" y1="13.5" x2="39"   y2="17"/>
                    <line x1="17"   y1="39"   x2="13.5" y2="42.5"/>
                  </g>
                </svg>
              </span>
              <span class="temp">26 °C</span>
            </li>
          </ol>

          <!-- Right scrim + next arrow -->
          <div class="forecast-scrim forecast-scrim--right"></div>
          <button class="forecast-arrow forecast-arrow--right" aria-label="Next days">
            <svg width="12" height="20" viewBox="0 0 12 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <polyline points="1,1 11,10 1,19" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

        </div>

        <div class="pagination-dots">
          <span class="dot active"></span>
          <span class="dot"></span>
        </div>
      </section>

      <footer>
        <button type="button" class="location-btn" aria-label="Change location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <address>New York City</address>
        </button>
      </footer>

    </section>

  </article>

  <script>
    // ── Unit toggle ───────────────────────────────────────
    const unitBtns = document.querySelectorAll('.unit-btn');

    unitBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        unitBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPage(currentPage);
      });
    });

    // ── Forecast data ─────────────────────────────────────
    const pages = [
      [
        { abbr: 'Tue', full: 'Tuesday',   icon: 'sunny', tempC: '30 °C', tempF: '86 °F' },
        { abbr: 'Wed', full: 'Wednesday', icon: 'cloudy',     tempC: '22 °C', tempF: '72 °F' },
        { abbr: 'Thu', full: 'Thursday',  icon: 'rainy',      tempC: '06 °C', tempF: '43 °F' },
        { abbr: 'Fri', full: 'Friday',    icon: 'sunny',      tempC: '26 °C', tempF: '79 °F' },
      ],
      [
        { abbr: 'Sat', full: 'Saturday', icon: 'sunny',  tempC: '28 °C', tempF: '82 °F' },
        { abbr: 'Sun', full: 'Sunday',   icon: 'cloudy', tempC: '19 °C', tempF: '66 °F' },
        { abbr: 'Mon', full: 'Monday',   icon: 'rainy',  tempC: '14 °C', tempF: '57 °F' },
        { abbr: 'Tue', full: 'Tuesday',  icon: 'sunny',  tempC: '24 °C', tempF: '75 °F' },
      ]
    ];

    const iconSVGs = {
      'sunny-dark': `<svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="10" fill="#222831"/><g stroke="#222831" stroke-width="2.5" stroke-linecap="round"><line x1="28" y1="6" x2="28" y2="12"/><line x1="28" y1="44" x2="28" y2="50"/><line x1="6" y1="28" x2="12" y2="28"/><line x1="44" y1="28" x2="50" y2="28"/><line x1="12.69" y1="12.69" x2="16.97" y2="16.97"/><line x1="39.03" y1="39.03" x2="43.31" y2="43.31"/><line x1="43.31" y1="12.69" x2="39.03" y2="16.97"/><line x1="16.97" y1="39.03" x2="12.69" y2="43.31"/></g></svg>`,
      'sunny':      `<svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="9" fill="white" opacity="0.9"/><g stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.7"><line x1="28" y1="8" x2="28" y2="13"/><line x1="28" y1="43" x2="28" y2="48"/><line x1="8" y1="28" x2="13" y2="28"/><line x1="43" y1="28" x2="48" y2="28"/><line x1="13.5" y1="13.5" x2="17" y2="17"/><line x1="39" y1="39" x2="42.5" y2="42.5"/><line x1="42.5" y1="13.5" x2="39" y2="17"/><line x1="17" y1="39" x2="13.5" y2="42.5"/></g></svg>`,
      'cloudy':     `<svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><g stroke="white" stroke-width="2.2" stroke-linecap="round"><line x1="22" y1="8" x2="22" y2="13"/><line x1="10" y1="20" x2="14" y2="20"/><line x1="13.5" y1="11.5" x2="17" y2="15"/></g><circle cx="22" cy="20" r="7" fill="white" opacity="0.7"/><rect x="10" y="27" width="30" height="10" rx="5" fill="white" opacity="0.9"/></svg>`,
      'rainy':      `<svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="16" width="34" height="12" rx="6" fill="white" opacity="0.85"/><g stroke="white" stroke-width="2.2" stroke-linecap="round"><line x1="16" y1="33" x2="14" y2="40"/><line x1="24" y1="33" x2="22" y2="40"/><line x1="32" y1="33" x2="30" y2="40"/></g></svg>`
    };

    let currentPage = 0;
    const arrowLeft  = document.querySelector('.forecast-arrow--left');
    const arrowRight = document.querySelector('.forecast-arrow--right');
    const scrimLeft  = document.querySelector('.forecast-scrim--left');
    const scrimRight = document.querySelector('.forecast-scrim--right');
    const dots       = document.querySelectorAll('.pagination-dots .dot');

    function getUnit() {
      return document.querySelector('.unit-btn.active').dataset.unit;
    }

    // ── Current weather data ──────────────────────────────
    const currentWeather = {
      c: { temp: '29 °C', range: 'H: 31° L: 24°', condition: 'Sunny' },
      f: { temp: '84 °F', range: 'H: 88° L: 75°', condition: 'Sunny' }
    };

    function renderPage(pageIndex) {
      const days  = pages[pageIndex];
      const unit  = getUnit();
      const items = document.querySelectorAll('.forecast-day');

      // Update left panel
      const cw = currentWeather[unit];
      document.querySelector('.temperature').textContent = cw.temp;
      document.querySelector('.range').textContent       = cw.range;
      document.querySelector('.condition').textContent   = cw.condition;

      items.forEach((item, i) => {
        const day    = days[i];
        const active = pageIndex === 0 && i === 0;
        item.querySelector('abbr').textContent    = day.abbr;
        item.querySelector('abbr').title          = day.full;
        item.querySelector('.day-icon').innerHTML = iconSVGs[active ? 'sunny-dark' : day.icon.replace('-dark', '')];
        item.querySelector('.temp').textContent   = unit === 'c' ? day.tempC : day.tempF;
        item.classList.toggle('active', active);
      });

      // Pagination dots
      dots.forEach((dot, i) => dot.classList.toggle('active', i === pageIndex));

      const atStart = pageIndex === 0;
      const atEnd   = pageIndex === pages.length - 1;

      // Left arrow + scrim: hidden on first page, visible on any later page
      arrowLeft.style.opacity       = atStart ? '0' : '1';
      arrowLeft.style.pointerEvents = atStart ? 'none' : 'auto';
      scrimLeft.style.opacity       = atStart ? '0' : '1';

      // Right arrow + scrim: visible until last page, then hidden
      arrowRight.style.opacity       = atEnd ? '0' : '1';
      arrowRight.style.pointerEvents = atEnd ? 'none' : 'auto';
      scrimRight.style.opacity       = atEnd ? '0' : '1';
    }

    arrowRight.addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        renderPage(currentPage);
      }
    });

    arrowLeft.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        renderPage(currentPage);
      }
    });

    // Initial render to set correct arrow states
    renderPage(0);
  </script>

</body>
</html>
